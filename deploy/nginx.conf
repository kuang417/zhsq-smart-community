# 生产反向代理：TLS 终止 + 全部请求反代到 Express（静态资源由应用容器内的 dist 提供）
# V2.5 审计修复：原配置用 root/alias 指向 /app/dist，但 compose 里并没有共享该目录的卷，
# 在宿主机安装 Nginx 时 /assets/* 与 SPA 页面会全部 404。改为纯反代后，
# 宿主机 Nginx 与容器内 Nginx 两种拓扑都能工作，无需挂载 dist 卷。
# 单实例 SQLite 部署，请勿配置多后端负载均衡（写会分散到不同库文件）
upstream zhsq_app {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;   # 改成实际域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 25m;              # Excel 导入上限 20MB，留出余量

    # 安全头统一在这里定义：每个 location 一旦声明自己的 add_header，
    # 就不再继承 server 级定义，因此必须逐段重复，避免 /assets/ 与 SPA 页面丢头。
    # /api/ 的响应头由后端 Express 设置（含生产 HSTS），此处不重复添加，防止同名头出现两次。
    location = /api { return 404; }        # 避免无尾斜杠落到 SPA fallback

    location /assets/ {
        proxy_pass http://zhsq_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        proxy_pass http://zhsq_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SPA history 回退由 Express 的 app.get('*') 完成，Nginx 不再依赖本地 dist 路径
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;   # index.html 不缓存，避免发版后仍引用旧 chunk
    }

    # V2.4 SSE 实时通道：必须关闭代理缓冲，并把读超时放宽到与连接生命周期一致，
    # 否则 Nginx 会把事件攒着不下发 / 120s 后主动断开长连接（前端会自动降级为 30s 轮询）。
    location = /api/events {
        proxy_pass http://zhsq_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        chunked_transfer_encoding on;
    }

    # API：保留 Host / 真实 IP，便于限流与审计（后端需 ZHSQ_TRUST_PROXY=1 才会采信）
    location /api/ {
        proxy_pass http://zhsq_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;               # 大 Excel 导入
        proxy_request_buffering off;
    }
}
